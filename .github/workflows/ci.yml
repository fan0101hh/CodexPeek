name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Core checks (synthetic data only)
        run: swift run CodexPeekChecks
      - name: Build application and installer image
        run: bash scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CodexPeek-macOS
          path: |
            dist/CodexPeek.dmg
            dist/CodexPeek.zip
